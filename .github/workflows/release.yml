name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $rawVersion = "${{ github.ref_name }}"
          $version = $rawVersion.TrimStart("v")
          New-Item -ItemType Directory -Force -Path "build/installer"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DMyAppVersion="$version" packaging\windows\inno_setup.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/installer/user-manager-windows-x64-setup.exe
          retention-days: 1

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import Apple Developer ID Certificate
        if: ${{ secrets.MACOS_CERTIFICATE != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build macOS release
        run: flutter build macos --release

      - name: Sign, Package, and Notarize macOS DMG and ZIP
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          brew install create-dmg
          mkdir -p build/installer

          APP_PATH="build/macos/Build/Products/Release/User Manager for PostgreSQL.app"
          DMG_PATH="build/installer/user-manager-macos-universal.dmg"
          ZIP_PATH="build/installer/user-manager-macos-app.zip"

          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing nested frameworks and dylibs..."
            find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -o -name "*.framework" | while read -r item; do
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$item"
            done

            echo "Signing application bundle..."
            codesign --force --options runtime --timestamp \
              --entitlements macos/Runner/Release.entitlements \
              --sign "$SIGNING_IDENTITY" "$APP_PATH"

            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          else
            echo "::warning::MACOS_SIGNING_IDENTITY secret is not set. Building unsigned package."
          fi

          # Create standalone .zip archive of the .app
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          if [ -n "$SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Submitting .app archive for Apple Notarization..."
            xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

            echo "Stapling notarization ticket to .app..."
            xcrun stapler staple "$APP_PATH"

            # Recreate .zip so it includes the stapled ticket
            rm -f "$ZIP_PATH"
            ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          fi

          # Create DMG
          create-dmg \
            --volname "User Manager for PostgreSQL" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "User Manager for PostgreSQL.app" 180 190 \
            --hide-extension "User Manager for PostgreSQL.app" \
            --app-drop-link 480 185 \
            --no-internet-enable \
            "$DMG_PATH" \
            "$APP_PATH" || true

          # Fallback to hdiutil if create-dmg did not output the file
          if [ ! -f "$DMG_PATH" ]; then
            hdiutil create -volname "User Manager for PostgreSQL" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_PATH"
          fi

          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing DMG..."
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"

            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Submitting DMG for Apple Notarization..."
              xcrun notarytool submit "$DMG_PATH" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait

              echo "Stapling notarization ticket to DMG..."
              xcrun stapler staple "$DMG_PATH"
            fi
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build/installer/user-manager-macos-universal.dmg
            build/installer/user-manager-macos-app.zip
          retention-days: 1

  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux .deb and .tar.gz
        run: |
          mkdir -p build/installer
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          PKG_DIR="build/deb/user-manager-for-postgresql_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/lib/user_manager"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"

          # 1. Copy bundle binaries, libraries, and assets
          cp -r build/linux/x64/release/bundle/* "${PKG_DIR}/usr/lib/user_manager/"

          # 2. Symlink binary into /usr/bin (relative path as per Debian policy)
          ln -s ../lib/user_manager/user_manager "${PKG_DIR}/usr/bin/user_manager"

          # 3. Copy desktop entry and icon
          cp packaging/linux/user-manager.desktop "${PKG_DIR}/usr/share/applications/dev.dbroles.postgresql.desktop"
          cp assets/icons/app_icon.png "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/user_manager.png"

          # 4. Generate Debian control file from template
          sed "s/@@VERSION@@/${VERSION}/g" packaging/linux/control.template > "${PKG_DIR}/DEBIAN/control"

          # 5. Fix permissions (directories and files)
          chmod -R 755 "${PKG_DIR}/usr/lib/user_manager"
          chmod 644 "${PKG_DIR}/usr/share/applications/dev.dbroles.postgresql.desktop"
          chmod 644 "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/user_manager.png"
          chmod 755 "${PKG_DIR}/DEBIAN"
          chmod 644 "${PKG_DIR}/DEBIAN/control"

          # 6. Build .deb package
          dpkg-deb --build --root-owner-group "${PKG_DIR}" "build/installer/user-manager-linux-amd64.deb"

          # 7. Also build portable .tar.gz
          tar -czvf "build/installer/user-manager-linux-x64.tar.gz" -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/installer/user-manager-linux-amd64.deb
            build/installer/user-manager-linux-x64.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: dist/*
